name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Tests (movement, weapons, damage, netcode, anti-cheat)
        run: dotnet test Tests/Vexa.Tests -c Release
      - name: Build dedicated server
        run: dotnet build Server/Vexa.Server -c Release
      - name: Compile-check Unity client scripts
        run: dotnet build Tools/UnityCheck -c Release
